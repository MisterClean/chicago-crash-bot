[tool.poetry]
name = "chicago-crash-bot"
version = "0.1.0"
description = "ETL pipeline for Chicago traffic crash data with GIS enrichment"
authors = ["Michael McLean"]
readme = "README.md"
packages = [{include = "chicago_crash_bot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.2.3"
sqlalchemy = "^2.0.37"
geoalchemy2 = "^0.17.0"
psycopg2-binary = "^2.9.10"
sodapy = "^2.2.0"
prefect = "^3.1.12"
python-dotenv = "^1.0.1"
shapely = "^2.0.6"
geopandas = "^1.0.1"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^24.2.0"
isort = "^5.13.2"
flake8 = "^7.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=chicago_crash_bot --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.poetry.scripts]
chicago-crash-bot = "chicago_crash_bot.cli:main"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.poetry.urls]
"Homepage" = "https://github.com/yourusername/chicago-crash-bot"
"Bug Tracker" = "https://github.com/yourusername/chicago-crash-bot/issues"

[tool.poetry.license]
text = "MIT"
